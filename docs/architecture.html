<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMI Recovery Agent Architecture</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  svg{display:block;font-family:"Inter","Segoe UI","Helvetica Neue",Arial,"DejaVu Sans",sans-serif;}
  .t{fill:#0f172a;}
  .h{font-size:20px;font-weight:700;fill:#0f172a;}
  .sub{font-size:13.5px;fill:#475569;}
  .b{font-size:14.5px;fill:#1e293b;}
  .m{font-family:"DejaVu Sans Mono","Menlo","Consolas",monospace;font-size:12.5px;fill:#1e293b;}
  .lbl{font-family:"DejaVu Sans Mono","Menlo","Consolas",monospace;font-size:12.5px;fill:#1d4ed8;font-weight:600;}
  .small{font-size:12px;fill:#64748b;}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="46" class="t" font-size="26" font-weight="800">Razorpay Autopay Recovery Voice Agent — Architecture</text>
  <text x="30" y="72" class="sub">Failed autopay / EMI mandate → outbound Sarvam voice call → tool calls on the Customer/Payment API → logged recovery outcome</text>

  <!-- ===== Data ===== -->
  <rect x="30" y="110" width="230" height="250" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="140" class="h">10 Fictional</text>
  <text x="48" y="164" class="h">Customers</text>
  <text x="48" y="188" class="m">data/customers.json</text>
  <line x1="48" y1="202" x2="242" y2="202" stroke="#e2e8f0"/>
  <text x="48" y="226" class="b">CUS_001 … CUS_010</text>
  <text x="48" y="250" class="sub">failure codes, attempts,</text>
  <text x="48" y="270" class="sub">mandate, dispute flag,</text>
  <text x="48" y="290" class="sub">preferred language</text>
  <text x="48" y="320" class="small">reload via POST /api/reset</text>

  <!-- Data -> API -->
  <line x1="260" y1="235" x2="296" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="278" y="225" class="small" text-anchor="middle">load</text>

  <!-- ===== API ===== -->
  <rect x="300" y="110" width="320" height="450" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="142" class="h">Customer / Payment API</text>
  <text x="320" y="166" class="m">backend/server.ts</text>
  <text x="320" y="186" class="sub">Node + TypeScript · x-api-key auth</text>
  <line x1="320" y1="200" x2="600" y2="200" stroke="#bfdbfe"/>
  <text x="320" y="224" class="m">GET  /api/customers/:id</text>
  <text x="320" y="250" class="m">GET  /api/customers/:id/payment</text>
  <text x="320" y="300" class="m">POST /api/payments/:id/retry</text>
  <text x="320" y="350" class="m">POST /api/payments/:id/payment-link</text>
  <text x="320" y="400" class="m">POST /api/callbacks</text>
  <text x="320" y="450" class="m">POST /api/escalations</text>
  <text x="320" y="500" class="m">POST /api/outcomes</text>
  <text x="320" y="530" class="m">GET  /api/outcomes  (audit log)</text>

  <!-- ===== Tool-call arrows (agent -> API) ===== -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none">
    <line x1="840" y1="250" x2="624" y2="250" marker-end="url(#arB)"/>
    <line x1="840" y1="300" x2="624" y2="300" marker-end="url(#arB)"/>
    <line x1="840" y1="350" x2="624" y2="350" marker-end="url(#arB)"/>
    <line x1="840" y1="400" x2="624" y2="400" marker-end="url(#arB)"/>
    <line x1="840" y1="450" x2="624" y2="450" marker-end="url(#arB)"/>
    <line x1="840" y1="500" x2="624" y2="500" marker-end="url(#arB)"/>
  </g>
  <g text-anchor="middle">
    <text x="732" y="243" class="lbl">get_payment_status</text>
    <text x="732" y="293" class="lbl">retry_payment</text>
    <text x="732" y="343" class="lbl">send_payment_link</text>
    <text x="732" y="393" class="lbl">schedule_callback</text>
    <text x="732" y="443" class="lbl">escalate_to_human</text>
    <text x="732" y="493" class="lbl">log_outcome</text>
  </g>
  <text x="732" y="150" class="small" text-anchor="middle" font-weight="700">TOOL CALLS (HTTP)</text>
  <!-- response arrow -->
  <line x1="624" y1="190" x2="840" y2="190" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="732" y="182" class="small" text-anchor="middle">JSON + recovery_options</text>

  <!-- ===== Agent ===== -->
  <rect x="840" y="110" width="410" height="450" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="142" class="h">Sarvam Voice Agent</text>
  <text x="860" y="164" class="sub">6 Indian languages: hi · en · ta · te · bn · mr</text>
  <!-- pipeline -->
  <rect x="860" y="180" width="80" height="44" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="900" y="207" class="b" text-anchor="middle" font-weight="700">STT</text>
  <line x1="940" y1="202" x2="964" y2="202" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="966" y="180" width="160" height="44" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1046" y="199" class="b" text-anchor="middle" font-weight="700">LLM</text>
  <text x="1046" y="216" class="small" text-anchor="middle">+ system prompt</text>
  <line x1="1126" y1="202" x2="1150" y2="202" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="1152" y="180" width="80" height="44" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1192" y="207" class="b" text-anchor="middle" font-weight="700">TTS</text>
  <!-- capabilities -->
  <rect x="860" y="242" width="372" height="300" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="878" y="268" class="small" font-weight="700">AGENT CAPABILITIES</text>
  <g class="b">
    <circle cx="884" cy="292" r="10" fill="#ede9fe"/><text x="884" y="296.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">1</text><text x="904" y="297">Understand failure</text>
    <circle cx="884" cy="327" r="10" fill="#ede9fe"/><text x="884" y="331.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">2</text><text x="904" y="332">Explain payment issue</text>
    <circle cx="884" cy="362" r="10" fill="#ede9fe"/><text x="884" y="366.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">3</text><text x="904" y="367">Offer recovery</text>
    <circle cx="884" cy="397" r="10" fill="#ede9fe"/><text x="884" y="401.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">4</text><text x="904" y="402">Retry payment</text>
    <circle cx="884" cy="432" r="10" fill="#ede9fe"/><text x="884" y="436.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">5</text><text x="904" y="437">Send payment link (SMS / WhatsApp)</text>
    <circle cx="884" cy="467" r="10" fill="#ede9fe"/><text x="884" y="471.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">6</text><text x="904" y="472">Schedule callback</text>
    <circle cx="884" cy="502" r="10" fill="#ede9fe"/><text x="884" y="506.5" font-size="12" text-anchor="middle" fill="#6d28d9" font-weight="700">7</text><text x="904" y="507">Escalate to human</text>
  </g>

  <!-- Agent <-> Customer -->
  <line x1="1254" y1="300" x2="1356" y2="300" stroke="#334155" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="1305" y="288" class="small" text-anchor="middle">voice call</text>
  <text x="1305" y="320" class="small" text-anchor="middle">speech ⇄ speech</text>

  <!-- ===== Customer ===== -->
  <rect x="1360" y="180" width="210" height="240" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <!-- phone icon -->
  <rect x="1440" y="200" width="50" height="86" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <rect x="1447" y="212" width="36" height="58" rx="3" fill="#dcfce7"/>
  <circle cx="1465" cy="278" r="3.5" fill="#15803d"/>
  <text x="1465" y="320" class="h" text-anchor="middle">Customer</text>
  <text x="1465" y="344" class="sub" text-anchor="middle">on the phone</text>
  <text x="1465" y="370" class="small" text-anchor="middle">consents, asks questions,</text>
  <text x="1465" y="388" class="small" text-anchor="middle">picks a recovery option</text>

  <!-- ===== Guardrails ===== -->
  <rect x="380" y="610" width="870" height="185" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="642" class="h" style="fill:#991b1b">Guardrails</text>
  <text x="520" y="642" class="sub">enforced in the system prompt and server-side by the API</text>
  <g class="b">
    <text x="400" y="680">✔ Consent required before any retry</text>
    <text x="400" y="682" dy="22" class="m" style="fill:#b91c1c">CONSENT_REQUIRED</text>
    <text x="400" y="740">✔ Never ask for OTP / CVV / PIN</text>
    <text x="400" y="762" class="m" style="fill:#b91c1c">SENSITIVE_DATA_REJECTED</text>
    <text x="700" y="680">✔ No re-debit if already recovered</text>
    <text x="700" y="704" class="m" style="fill:#b91c1c">ALREADY_RECOVERED</text>
    <text x="700" y="740">✔ Disputes → human</text>
    <text x="700" y="762" class="m" style="fill:#b91c1c">DISPUTED_ESCALATE</text>
    <text x="990" y="680">✔ Max 3 retry attempts</text>
    <text x="990" y="704" class="m" style="fill:#b91c1c">MAX_ATTEMPTS_REACHED</text>
    <text x="990" y="740">  then offer payment link</text>
  </g>
  <!-- guardrail links -->
  <line x1="500" y1="608" x2="500" y2="564" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <line x1="1045" y1="608" x2="1045" y2="564" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arR)"/>

  <!-- ===== Legend ===== -->
  <rect x="1300" y="610" width="270" height="185" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1318" y="640" class="small" font-weight="700">LEGEND</text>
  <line x1="1318" y1="668" x2="1370" y2="668" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arB)"/>
  <text x="1382" y="672" class="small">agent tool call</text>
  <line x1="1318" y1="702" x2="1370" y2="702" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="1382" y="706" class="small">API response</text>
  <line x1="1318" y1="736" x2="1370" y2="736" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arR)"/>
  <text x="1382" y="740" class="small">guardrail enforcement</text>
  <line x1="1318" y1="770" x2="1370" y2="770" stroke="#15803d" stroke-width="2" marker-end="url(#arG)"/>
  <text x="1382" y="774" class="small">outcome logged</text>

  <!-- API -> outcome -->
  <path d="M330 560 L330 832" stroke="#15803d" stroke-width="2.2" fill="none" marker-end="url(#arG)"/>
  <text x="340" y="592" class="small" style="fill:#15803d" font-weight="700">log_outcome</text>

  <!-- ===== Outcome ===== -->
  <rect x="30" y="836" width="1540" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="868" class="h">Recovery Outcome</text>
  <text x="248" y="868" class="sub">→  POST /api/outcomes  →  audit log of every tool action + outcome (GET /api/outcomes)</text>
  <g>
    <rect x="50"   y="896" width="236" height="50" rx="25" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="168"  y="926" class="m" text-anchor="middle" font-weight="700">payment_recovery_initiated</text>
    <rect x="304"  y="896" width="236" height="50" rx="25" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="422"  y="926" class="m" text-anchor="middle" font-weight="700">payment_link_sent</text>
    <rect x="558"  y="896" width="236" height="50" rx="25" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="676"  y="926" class="m" text-anchor="middle" font-weight="700">callback_scheduled</text>
    <rect x="812"  y="896" width="236" height="50" rx="25" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930"  y="926" class="m" text-anchor="middle" font-weight="700">escalated</text>
    <rect x="1066" y="896" width="236" height="50" rx="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1184" y="926" class="m" text-anchor="middle" font-weight="700">customer_declined</text>
    <rect x="1320" y="896" width="236" height="50" rx="25" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1438" y="926" class="m" text-anchor="middle" font-weight="700">already_paid</text>
  </g>
</svg>
</body>
</html>
